baseURL = 'https://mavai.org/'
locale = 'en'
title = 'Mavai — Testing Non-Deterministic Systems'
enableRobotsTXT = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[params]
  description = "Bringing solutions to difficult questions of testing non-deterministic systems, such as AI."
  author = "Mavai"
  tagline = "Measure. Regress. Trust."
  ogImage = "images/og-default.png"
  # Search engine ownership verification. Paste the token from Google Search
  # Console (Settings → Ownership verification → HTML tag) and Bing Webmaster
  # Tools — the content value only, not the full meta tag. Empty = no tag.
  googleSiteVerification = ""
  bingSiteVerification = ""
  # Profiles linked from the Organization JSON-LD `sameAs`. Helps search engines
  # tie the site to known entities and disambiguate the "punit" name.
  sameAs = [
    "https://github.com/mavai-org",
    "https://www.linkedin.com/in/mike-franz-mannion/",
  ]
  keywords = [
    "probabilistic testing",
    "AI performance measurement",
    "ISO 42001",
    "FINMA",
    "non-deterministic testing",
    "AI regression testing",
    "statistical unit testing",
    "AI compliance",
    "AI risk management",
    "stochastic testing",
    "AI governance",
    "AI audit",
    "machine learning testing",
    "AI quality assurance",
    "punit",
    "JUnit statistical assertions"
  ]

[markup.goldmark.renderer]
  unsafe = true

[params.analytics]
  # Full URL of the site-specific Plausible script. Empty string disables
  # analytics. The URL embeds the site ID (public; visible in page source).
  # Different per site: mavai.org and mavai.ch each have their own script URL.
  plausibleScriptUrl = "https://plausible.io/js/pa-R0QJ2aTt6MLM6ZeOCNBuT.js"

# Author registry. Posts reference an author by key via the `author` frontmatter
# field; the engagement partial and byline resolve name and LinkedIn URL from
# here. Add further curators by appending new [params.authors.<key>] blocks.
[params.authors.michael]
  name = "Michael Mannion"
  linkedin = "https://www.linkedin.com/in/mike-franz-mannion/"

[params.engagement]
  # Global on/off for the end-of-post engagement block. A per-post frontmatter
  # `engagement: false` can suppress the block on a specific post.
  enabled = true

[menus]
  [[menus.main]]
    name = 'Probabilistic Testing'
    pageRef = '/probabilistic-testing'
    weight = 5
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 10
  [[menus.main]]
    name = 'Signals'
    pageRef = '/signals'
    weight = 20
  [[menus.main]]
    name = 'News'
    pageRef = '/news'
    weight = 30
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 50
